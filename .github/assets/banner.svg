<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glowAmber" cx="26%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#e2b714" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#e2b714" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="82%" cy="76%" r="62%">
      <stop offset="0%" stop-color="#ffd38a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffd38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e0a8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#glowAmber)"/>
  <rect width="1200" height="320" fill="url(#glowWarm)"/>

  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="107" x2="1200" y2="107"/>
    <line x1="0" y1="214" x2="1200" y2="214"/>
  </g>

  <!-- the live stats line, the way the test screen shows it -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" font-weight="600">
    <text x="92" y="76" fill="#e2b714">12.4s</text>
    <text x="1108" y="76" text-anchor="end" fill="#d1d0c5">118 wpm<tspan fill="#646669">   98% acc</tspan></text>
  </g>

  <!-- a word being typed: written, cursor, pending -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="23">
    <text x="92" y="268" fill="#d1d0c5">keyboard <tspan fill="#ca4754">frist</tspan><tspan fill="#d1d0c5"> habit</tspan><tspan fill="#646669"> without leaving the shell</tspan></text>
  </g>
  <rect x="92" y="286" width="420" height="4" rx="2" fill="#e2b714" opacity="0.85"/>
  <rect x="512" y="286" width="596" height="4" rx="2" fill="#ffffff" opacity="0.10"/>

  <text x="600" y="176" text-anchor="middle"
        font-family="ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="104" font-weight="700" letter-spacing="-2"
        fill="url(#textFade)">TypingBash</text>

  <text x="600" y="222" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif"
        font-size="24" font-weight="500" letter-spacing="0.6"
        fill="rgba(228,234,246,0.52)">a typing test that lives in the terminal</text>
</svg>
