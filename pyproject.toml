[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "typingbash"
version = "1.0.0"
description = "A terminal typing game in the spirit of Monkeytype, with zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["typing", "typing-test", "terminal", "tui", "monkeytype", "wpm"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
# No dependencies: everything runs on the standard library.
dependencies = []

[project.scripts]
typingbash = "typingbash.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
